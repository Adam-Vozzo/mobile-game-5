<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a0f2e">
    <title>Make the Cat Dizzy!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <div id="hud">
            <div id="title">Make the Cat Dizzy!</div>
            <div id="meter-wrapper">
                <div id="meter-label">Capture</div>
                <div id="meter-bar"><div id="meter-fill"></div></div>
            </div>
            <div id="stats">
                <span id="loop-count">Score: 0</span>
                <span id="level">Level: 1</span>
                <span id="time">Cats: 0/0</span>
            </div>
        </div>
        <button id="pause-btn" aria-label="Pause" title="Pause (P / Esc)">⏸</button>
        <canvas id="game"></canvas>
        <div id="overlay" class="show">
            <div id="overlay-card"></div>
        </div>
    </div>
    <script src="game.js"></script>
    <script src="src/achievements.js"></script>
    <script src="src/weather.js"></script>
    <script src="src/music.js"></script>
    <script src="src/cinematic.js"></script>
    <script src="src/catdex.js"></script>
    <script src="src/hotzones.js"></script>
    <script src="src/easter-eggs.js"></script>
    <script src="src/tutorial.js"></script>
</body>
</html>
